name: Valid
description: >-
  Valid is an AI-native advertising agency that grows consumer companies
  through an end-to-end performance marketing offering, combining AI-generated performance
  creative (20+ ads per month, moving from concept to launch in about three days),
  brand-specific AI-influencers with organic followings, and managed media buying
  across Meta, TikTok, Google, Snap, and AppLovin. Every managed client also receives
  the "Chat With Your Ads" MCP server — a live, first-party Model Context Protocol
  endpoint at mcp.valid.co that lets an agent query the whole ad account in plain
  English. That MCP surface is customer-gated rather than public: it is protected by
  an OAuth 2.1 authorization code flow with PKCE and RFC 7591 dynamic client
  registration, and it correctly serves the full RFC 9728 / RFC 8414 discovery chain,
  but Valid publishes no developer portal, no documentation, no OpenAPI, and no tool
  catalog, so the capability surface is invisible without a client account. Valid is
  backed by Canaan Partners and based in San Francisco, California.
