apis:
- name: Valid Chat With Your Ads MCP Server
  description: A live first-party Model Context Protocol server that lets a Valid
    managed-service client query their whole advertising account — spend, channels,
    creative performance, attribution — in plain English from an MCP-capable agent.
    Speaks JSON-RPC over streamable HTTP and is protected by an OAuth 2.1
    authorization code flow with PKCE, refresh tokens and dynamic client
    registration, with the full RFC 9728 protected-resource and RFC 8414
    authorization-server discovery chain published anonymously. The tool catalog
    itself is auth-gated; an anonymous tools/list returns 401.
  humanURL: https://valid.co/media-buying
  baseURL: https://mcp.valid.co/api/mcp/
