notes: >-
  This is the finding that changes Valid's profile. The 2026-07-21 round recorded
  "no public API or developer program" after probing only valid.co. Valid does run a
  real, live, first-party MCP server — it is simply not advertised on a developer
  portal, has no documentation site, and is reachable only by its managed-service
  clients. The API surface is therefore CUSTOMER-GATED, not absent: an agent surface
  exists, is OAuth 2.1-protected with dynamic client registration and PKCE, and
  correctly implements both RFC 8414 and RFC 9728 discovery — a better-than-average
  MCP auth posture — but its capability surface is invisible to anyone without a
  client account.
