tools_note: >-
  NOT RECORDED — the live tool schema is auth-gated and Valid publishes no fallback
  list. An anonymous JSON-RPC tools/list POST to https://mcp.valid.co/api/mcp/
  returns HTTP 401 {"detail":"Not authenticated"} with WWW-Authenticate: Bearer, and
  /llms.txt, /openapi.json, /docs and /redoc on the same host all return HTTP 407
