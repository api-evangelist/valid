server:
  name: Chat With Your Ads MCP Server
  name_source: >-
    resource_name in the RFC 9728 protected-resource metadata document served at
    https://mcp.valid.co/.well-known/oauth-protected-resource (HTTP 200). The name
    matches Valid's own media-buying page copy verbatim, which is how ownership of
    this endpoint is established.
  transport: http
  url: https://mcp.valid.co/api/mcp/
  alt_url: https://v1.valid-gke-data-api.com/api/mcp/
  runtime: >-
    uvicorn (FastAPI), fronted by a Google Cloud load balancer (the responses carry
    a "via: 1.1 google" header and a GCLB cookie).
  listings: []
  listings_note: >-
    No public MCP registry, Claude Connector store, or ChatGPT Apps listing was found
    for this server. It is offered to Valid's managed-service clients, not to the
    open developer public.
auth:
  methods: [oauth2, apikey]
  gated: true
  oauth2:
    authorization_server: https://mcp.valid.co
    metadata: well-known/valid-oauth-authorization-server.json
    protected_resource_metadata: well-known/valid-oauth-protected-resource.json
    authorization_endpoint: https://mcp.valid.co/oauth/authorize
    token_endpoint: https://mcp.valid.co/oauth/token
    registration_endpoint: https://mcp.valid.co/oauth/register
    dynamic_client_registration: true
    scopes_supported: [openid, email, profile]
    grant_types: [authorization_code, refresh_token]
    response_types: [code]
    pkce: [S256, plain]
    bearer_methods_supported: [header]
  apikey:
    note: >-
      An outer gate sits in front of everything on the host except /health and the
      three OAuth/OIDC metadata paths, answering HTTP 407 with
      {"error":"API key missing"}. The MCP endpoint itself answers HTTP 401
      {"detail":"Not authenticated"} with WWW-Authenticate: Bearer.
tool_count: null
