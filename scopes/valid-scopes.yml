notes: >-
  All three advertised scopes are identity scopes. Valid publishes NO resource
  scopes — nothing like ads:read, spend:read, campaigns:write — even though the
  server's stated purpose is querying an advertising account. Authorization to the
  underlying ad data is therefore not expressed in the OAuth scope layer at all; it
  is presumably bound to the client account behind the token. For an agent surface
  this matters: a consenting user cannot grant an agent read-only access to spend
  data, because no scope exists to describe that. Recording the gap is the finding.
