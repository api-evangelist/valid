source: live HTTPS probes of every Valid host (2026-08-12)
notes: >-
  Round 2 supersedes the 2026-07-21 probe, which only looked at valid.co and
  concluded Valid published nothing. Valid DOES serve real discovery documents —
  they live on the MCP host (mcp.valid.co), not the marketing site. Three
  documents return 200 with real JSON bodies: RFC 8414 OAuth 2.0 Authorization
  Server Metadata, RFC 9728 OAuth 2.0 Protected Resource Metadata, and an
  OpenID Connect discovery document (byte-identical to the RFC 8414 document).
  Everything else on mcp.valid.co sits behind an outer API-key gate that answers
  HTTP 407 {"error":"API key missing"} — including /.well-known/agent-card.json,
  so NO A2A agent card is claimed. www.valid.co and clients.valid.co 404 every
  path; api.valid.co is a Kong gateway that answers 404 "no Route matched with
  those values" on every path.
